# CI：双端 typecheck/build（无库校验）。
# 数据库冒烟已迁 MySQL 隔离体系（smoke-isolated + wechat_pipeline_smoke，
# 见 docs/restructure/T0-MYSQL-ADAPT-REPORT.md），需要 MySQL 环境；
# CI 恢复冒烟留 S6 测试固化。本 job 只做 generate + typecheck + web build。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # build 内含 vue-tsc；单独 typecheck 一次让报错更早出现（两步串行，勿并行）
      - run: npm run typecheck
      - run: npm run build
