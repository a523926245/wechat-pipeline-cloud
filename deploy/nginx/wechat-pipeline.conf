# ─────────────────────────────────────────────────────────────
# WeChat Pipeline Cloud — Nginx 站点
#
# Debian/Ubuntu: 软链到 /etc/nginx/sites-enabled/
#   sudo ln -s /opt/wechat-pipeline-cloud/deploy/nginx/wechat-pipeline.conf \
#              /etc/nginx/sites-enabled/wechat-pipeline.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# RHEL/CentOS: 放到 /etc/nginx/conf.d/wechat-pipeline.conf（该目录已被主配置 include）
# ─────────────────────────────────────────────────────────────

upstream wechat_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 按需改成你的域名；HTTP 阶段先留着，配好 TLS 后建议 301 到 https
    # server_name pipeline.example.com;

    root /opt/wechat-pipeline-cloud/web/dist;
    index index.html;

    access_log /var/log/nginx/wechat-pipeline.access.log;
    error_log  /var/log/nginx/wechat-pipeline.error.log warn;

    # 封面 PNG / 文章 HTML 都从这里走；8m 对单篇公众号内容绰绰有余
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── 后端接口 ──
    # ⚠️ 两点必须照抄，改错就是「前端看得到缩略图、推送出去没封面」：
    #   1. 用 ^~ 前缀匹配，优先级高于下面的正则/通用 location
    #   2. proxy_pass **不带 URI 尾缀**（不要写 http://wechat_api/），
    #      否则 /api/content/covers/xxx.png 会被 rewrite 成 /content/covers/xxx.png
    location ^~ /api/ {
        proxy_pass http://wechat_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keepalive 需要清掉 Connection 头
        proxy_set_header Connection        "";

        # 生图/写作单次可能跑满 LLM_TIMEOUT_MS（默认 300 秒）。
        # 这里必须 > 300，否则 Nginx 会先把连接掐断，后端还在跑、前端只看到 504。
        proxy_connect_timeout 10s;
        proxy_send_timeout    330s;
        proxy_read_timeout    330s;

        # 流式/大响应体不缓冲，避免首字节延迟
        proxy_buffering off;
    }

    # ── 构建产物：带 hash 的长缓存 ──
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback ──
    # 路由是 createWebHistory（非 hash），深链刷新必须回落到 index.html，
    # 否则 /articles/12 直接刷新会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 鉴权样板（本轮没做应用层登录，务必二选一）──────────────────
    # 当前所有 /api/* 都是裸奔的：任何人都能读到凭据掩码、改模型、推草稿。
    # 下面两种方案挑一种，取消注释后 reload nginx。
    #
    # 方案 A：HTTP Basic Auth（最小成本，适合自用后台）
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.wpc_htpasswd admin
    #   sudo chmod 640 /etc/nginx/.wpc_htpasswd && sudo chown root:www-data /etc/nginx/.wpc_htpasswd
    #
    # location ^~ /api/ {
    #     auth_basic            "WeChat Pipeline";
    #     auth_basic_user_file  /etc/nginx/.wpc_htpasswd;
    #     proxy_pass http://wechat_api;
    #     ...（其余 proxy_* 同上）
    # }
    #
    # 方案 B：只允许内网/VPN 段访问
    #
    # location ^~ /api/ {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     deny  all;
    #     proxy_pass http://wechat_api;
    #     ...（其余 proxy_* 同上）
    # }
    # ──────────────────────────────────────────────────────────
}
